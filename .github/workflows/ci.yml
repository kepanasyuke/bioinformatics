name: ci

on:
  push:
  pull_request:

jobs:
  style-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка стиля
        run: python tools/check_style.py .
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck projects/*/src/*.sh projects/*/tools/*.sh || true
      - name: Тесты
        run: python tools/run_tests.py
      - name: Сборка отчётов
        run: make reports
      - name: Сборка шапок
        run: python -m tools.viz.header
