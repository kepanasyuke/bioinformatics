<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Hunt · найди баг в bash-пайплайне</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b1118;color:#e6edf3;font:15px/1.55 Inter,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 20px 64px}
header{margin-bottom:22px}
h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
.sub{color:#8aa0b4;margin:0}
.bar{display:flex;gap:12px;align-items:center;margin:18px 0;font-size:13px;color:#8aa0b4}
.track{flex:1;height:8px;background:#16202c;border-radius:6px;overflow:hidden;border:1px solid #22303f}
.fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#34d399);transition:width .3s ease}
.card{background:#111a24;border:1px solid #1d2a38;border-radius:14px;padding:20px}
h2{font-size:15px;margin:0 0 14px;color:#8aa0b4;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
pre{background:#070c12;border:1px solid #1d2a38;border-radius:10px;padding:14px 0;margin:0;overflow:auto;font:13px/1.75 "JetBrains Mono",Consolas,monospace}
.line{display:block;padding:1px 16px;cursor:pointer;border-left:3px solid transparent;white-space:pre}
.line:hover{background:#16202c}
.line.right{background:#0f2a22;border-left-color:#34d399}
.line.wrong{background:#2a1518;border-left-color:#f87171}
.line.locked{cursor:default}
.line.locked:hover{background:transparent}
.line.right.locked:hover{background:#0f2a22}
.num{color:#3f5468;user-select:none;margin-right:12px}
.explain{margin:16px 0 0;padding:14px 16px;border-radius:10px;background:#16202c;border:1px solid #22303f;font-size:14px}
.explain b{color:#38bdf8}
.explain.ok{border-color:#1f5142}.explain.ok b{color:#34d399}
.explain.bad{border-color:#4a2026}.explain.bad b{color:#f87171}
button{margin-top:16px;padding:10px 18px;border-radius:9px;border:1px solid #22303f;background:#16202c;color:#e6edf3;font-size:14px;cursor:pointer}
button:hover{background:#1d2a38}
button.primary{background:#0f3b52;border-color:#1b5b7d}
button.primary:hover{background:#134763}
.hidden{display:none}
.final{text-align:center;padding:28px 20px}
.score{font-size:52px;font-weight:700;color:#38bdf8;letter-spacing:-.03em}
.muted{color:#8aa0b4;font-size:13px;margin-top:8px}
footer{margin-top:24px;color:#5f7488;font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Bug Hunt</h1>
    <p class="sub">Десять сломанных bash-скриптов из биоинформатического пайплайна. Кликни на строку с ошибкой.</p>
  </header>

  <div class="bar">
    <span id="progress">вопрос 1 из 10</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span id="score">0 очков</span>
  </div>

  <div class="card" id="quiz">
    <h2 id="title">загрузка</h2>
    <pre id="code"></pre>
    <div class="explain hidden" id="explain"></div>
    <button class="primary hidden" id="next">Дальше</button>
  </div>

  <div class="card final hidden" id="final">
    <div class="score" id="final-score">0 / 10</div>
    <p class="muted" id="final-note"></p>
    <button id="restart">Пройти заново</button>
  </div>

  <footer>Все баги взяты из проекта 06 · <code>projects/06_legacy/ISSUES.md</code>. Каждый закрыт исправлением и тестом.</footer>
</main>

<script>
const cases = [
  {
    title: "Перебор файлов",
    code: ["#!/usr/bin/env bash", "cd /data/rnaseq", "for f in $(ls *.fastq); do", "  bwa mem -t 8 ref.fa $f > out.sam", "done"],
    bug: 2,
    text: "Имя файла с пробелом развалится на два аргумента. Правильно: <b>find -print0</b> плюс <b>while IFS= read -r -d ''</b>."
  },
  {
    title: "Каталог с данными",
    code: ["DIR=/data/projects/rnaseq", "cd $DIR", "rm -rf $TMP/", "echo done"],
    bug: 1,
    text: "<b>cd</b> без кавычек и без проверки: пустая переменная уводит в <b>/</b>, и следующий <b>rm -rf</b> работает не там."
  },
  {
    title: "Уборка",
    code: ["cleanup() {", "    rm -rf $TMP/", "}", "cleanup"],
    bug: 1,
    text: "Без кавычек и без проверки на пустоту <b>rm -rf $TMP/</b> при пустой переменной удаляет корень. Нужна отдельная функция <b>safe_rm_dir</b>."
  },
  {
    title: "Проверка VCF",
    code: ["check_vcf() {", "    if grep -q \"PASS\" $1; then", "        return 0", "    fi", "    return 1", "}"],
    bug: 1,
    text: "<b>grep PASS</b> ищет слово в любом месте строки, включая INFO. Варианты надо разбирать по табам: CHROM, POS, REF, ALT, FILTER."
  },
  {
    title: "Код возврата выравнивания",
    code: ["bwa mem -t 8 $REF $f > $TMP/out.sam", "samtools sort $TMP/out.sam > $TMP/out.bam", "echo $sample >> done.log"],
    bug: 0,
    text: "Падение <b>bwa</b> никто не проверяет: битый SAM уезжает в sort, а образец помечается как готовый. Нужен <b>|| status=1</b> и <b>set -e</b>."
  },
  {
    title: "Временный каталог",
    code: ["TMP=/tmp/pipe", "for s in S1 S2 S3; do", "  bwa mem ref.fa $s.fastq > $TMP/out.sam", "done"],
    bug: 0,
    text: "Один каталог на все образцы: при параллельном запуске два процесса пишут в один <b>out.sam</b> и затирают друг друга. Каталог должен быть на образец."
  },
  {
    title: "continue в глубине",
    code: ["for f in *.fastq; do", "  if [ -f $f ]; then", "    if [ -s $f ]; then", "      continue", "    fi", "  fi", "done"],
    bug: 3,
    text: "<b>continue</b> в четвёртом уровне вложенности читается как «пропустить», а на деле выходит из ветки в начало цикла. Условие надо инвертировать."
  },
  {
    title: "Чтение списка внутри цикла",
    code: ["while read sample; do", "  for param in $(cat config.txt); do", "    run $sample $param", "  done", "done < samples.txt"],
    bug: 1,
    text: "Вложенный <b>cat</b> внутри <b>while read</b> не съедает stdin, но такой шаблон ломается на <b>ssh</b> и <b>awk</b>: внутренняя команда вычитывает поток. Надёжнее — дескриптор <b>3&lt;&lt;</b>."
  },
  {
    title: "Сравнение переменной",
    code: ["sample=$(basename $f .fastq)", "if [ $sample = \"\" ]; then", "  echo \"пустое имя\"", "fi"],
    bug: 1,
    text: "Незакавыченная переменная в <b>[ ]</b> даёт синтаксическую ошибку при пустом значении. Правильно: <b>[[ -z \"$sample\" ]]</b>."
  },
  {
    title: "Проглоченная ошибка",
    code: ["check_vcf $1 || echo \"проверка не прошла\"", "echo \"пайплайн завершён успешно\"", "exit 0"],
    bug: 2,
    text: "<b>exit 0</b> в конце гарантирует «успех» даже после ошибки. Код возврата надо накапливать в переменной и возвращать его."
  }
];

let index = 0;
let score = 0;
let answered = false;

const codeBox = document.getElementById("code");
const titleBox = document.getElementById("title");
const explainBox = document.getElementById("explain");
const nextBtn = document.getElementById("next");
const quizBox = document.getElementById("quiz");
const finalBox = document.getElementById("final");

function draw() {
  const item = cases[index];
  answered = false;
  codeBox.innerHTML = "";
  titleBox.textContent = `${index + 1}. ${item.title}`;
  explainBox.className = "explain hidden";
  nextBtn.classList.add("hidden");
  item.code.forEach((text, number) => {
    const row = document.createElement("span");
    row.className = "line";
    row.innerHTML = `<span class="num">${number + 1}</span>${escapeHtml(text)}`;
    row.onclick = () => answer(number, row);
    codeBox.appendChild(row);
  });
  updateBar();
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function answer(number, row) {
  if (answered) { return; }
  answered = true;
  const item = cases[index];
  const rows = codeBox.querySelectorAll(".line");
  rows.forEach((line) => line.classList.add("locked"));
  rows[item.bug].classList.add("right");
  const hit = number === item.bug;
  if (hit) {
    score += 1;
  } else {
    row.classList.add("wrong");
  }
  explainBox.className = hit ? "explain ok" : "explain bad";
  explainBox.innerHTML = hit ? `<b>Верно.</b> ${item.text}` : `<b>Мимо.</b> Смотри строку ${item.bug + 1}. ${item.text}`;
  explainBox.classList.remove("hidden");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = index === cases.length - 1 ? "Показать результат" : "Дальше";
  updateBar();
}

function next() {
  index += 1;
  if (index < cases.length) {
    draw();
  } else {
    finish();
  }
}

function finish() {
  quizBox.classList.add("hidden");
  finalBox.classList.remove("hidden");
  document.getElementById("final-score").textContent = `${score} / ${cases.length}`;
  const note = score >= 9 ? "Такой результат и нужен на ревью чужого кода." : score >= 6 ? "Крепкий средний уровень: видно, что bash читали." : "Стоит вернуться к ISSUES.md — там все десять багов с объяснениями.";
  document.getElementById("final-note").textContent = note;
}

function updateBar() {
  document.getElementById("progress").textContent = `вопрос ${Math.min(index + 1, cases.length)} из ${cases.length}`;
  document.getElementById("fill").style.width = `${(index / cases.length) * 100}%`;
  document.getElementById("score").textContent = `${score} очков`;
}

nextBtn.onclick = next;
document.getElementById("restart").onclick = () => {
  index = 0;
  score = 0;
  finalBox.classList.add("hidden");
  quizBox.classList.remove("hidden");
  draw();
};

draw();
</script>
</body>
</html>
